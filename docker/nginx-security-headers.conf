# Included at server level AND in every location that sets its own add_header:
# nginx only inherits add_header from the enclosing level when the current
# level defines none, so a single add_header in a location (Cache-Control…)
# silently dropped all of these.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
