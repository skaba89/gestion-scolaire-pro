# nginx principal du frontend App Service : processus non-root (USER nginx),
# fichiers temporaires et configuration générée sous /tmp, journaux sur
# stdout/stderr (visibles dans les logs du conteneur App Service).
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Seule configuration chargée : générée au démarrage (entrypoint.sh).
    include /tmp/nginx-appservice/site.conf;
}
