name: Build and deploy API to Azure Web App - api-schoolflow-prod-001

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/main_api-schoolflow-prod-001.yml

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: api-schoolflow-prod-001
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: Build API package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app/main.py

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-api
          rsync -a --delete \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.coverage' \
            --exclude='tests' \
            backend/ deploy-api/

      - name: Upload API package
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: deploy-api/
          retention-days: 1

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API package
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E511200F26514770AFFD32028F3A6E51 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_88981E7D96AD4AF497640B107DCD7E4B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0DBE98C8C80C43E68DC4044AAC5AC59D }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
