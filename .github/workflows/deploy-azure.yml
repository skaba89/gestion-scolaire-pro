name: Deploy to Azure (Container Apps)

# national-readiness audit, 2026-09: the infrastructure this repo has
# targeted since docs/DEPLOIEMENT_PRODUCTION.md (Container Apps, Key
# Vault, Application Insights, separate DEV/REC/PROD environments) has
# never actually existed — build-push-acr.yml only builds and pushes an
# image. This workflow is the missing "apply the infra + deploy the
# image" step, deliberately manual-only (workflow_dispatch, never a push
# trigger): applying infra/azure/main.bicep creates and can resize real,
# billed Azure resources, so it must never fire without a human
# explicitly choosing an environment and clicking Run.
#
# Each `environment:` below is a GitHub Environment that MUST be
# configured with required reviewers before this workflow can do
# anything real — see infra/azure/README.md for the one-time setup.
# Until that's done and AZURE_CLIENT_ID/AZURE_TENANT_ID/
# AZURE_SUBSCRIPTION_ID/POSTGRES_ADMIN_PASSWORD secrets are populated per
# environment, every run of this workflow fails at the "Azure login"
# step — that's the intended fail-safe, not a bug to silence.

# BUILD ONCE, PROMOTE MANY (docs/IMMUTABLE_RELEASES.md): this workflow no
# longer takes a raw image tag. It takes the tag of a GitHub Release
# published by .github/workflows/build-images.yml (format
# "release-<full Git SHA>"), downloads that release's release-manifest.json,
# and deploys EXACTLY the backend/frontend OCI digests it names — the same
# digests regardless of which environment this run targets. There is no
# `docker build`/`docker push` anywhere in this file: promoting REC or PROD
# never rebuilds anything, so DEV, REC and PROD that reference the same
# release are running byte-for-byte the same images.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - rec
          - prod
      release_tag:
        description: 'Release to deploy — a GitHub Release tag published by "Build images" (format: release-<full git sha>). No default: an unnamed release must never silently resolve to "latest".'
        required: true

permissions:
  id-token: write # required for OIDC federated login (azure/login@v2)
  contents: read # to download the release manifest (gh release download)

# ONE-SHOT MIGRATIONS (P0 — docs/AZURE_ONE_SHOT_MIGRATIONS.md): two
# workflow_dispatch runs targeting the same environment must never apply
# Bicep or start the migration Job concurrently — both could try to
# migrate the same database at once, or one run's "wait for the job" step
# could observe the other run's execution. cancel-in-progress stays false:
# a deploy that's already reached "Deploy application (api/worker/
# frontend)" must be allowed to finish rather than being cut off
# mid-rollout; the second run simply queues behind it. This is GitHub's
# own concurrency mechanism, not a bespoke lock, per this document's
# stated preference for reusing existing platform guarantees.
concurrency:
  group: deploy-azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FAIL CLOSED (docs/IMMUTABLE_RELEASES.md): a missing release, a
      # missing manifest asset, or a digest that doesn't match
      # "sha256:<64 hex chars>" all stop the deploy here — never a
      # fallback to a mutable tag or a "latest"-equivalent guess.
      - name: Resolve release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ inputs.release_tag }}"

          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release '$RELEASE_TAG' does not exist. It must be published by the 'Build images' workflow (.github/workflows/build-images.yml) before it can be deployed. Refusing to deploy without a real release."
            exit 1
          fi

          rm -f release-manifest.json
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern release-manifest.json --output release-manifest.json --clobber

          if [ ! -s release-manifest.json ]; then
            echo "::error::Release '$RELEASE_TAG' exists but has no release-manifest.json asset. Refusing to deploy."
            exit 1
          fi

          BACKEND_REPOSITORY=$(jq -r '.backend.repository' release-manifest.json)
          BACKEND_DIGEST=$(jq -r '.backend.digest' release-manifest.json)
          BACKEND_TAG=$(jq -r '.backend.tag' release-manifest.json)
          FRONTEND_REPOSITORY=$(jq -r '.frontend.repository' release-manifest.json)
          FRONTEND_DIGEST=$(jq -r '.frontend.digest' release-manifest.json)
          FRONTEND_TAG=$(jq -r '.frontend.tag' release-manifest.json)
          GIT_SHA=$(jq -r '.release.git_sha' release-manifest.json)

          DIGEST_RE='^sha256:[0-9a-f]{64}$'
          if [ -z "$BACKEND_REPOSITORY" ] || [ "$BACKEND_REPOSITORY" = "null" ] || ! [[ "$BACKEND_DIGEST" =~ $DIGEST_RE ]]; then
            echo "::error::release-manifest.json's backend digest is missing or malformed ('$BACKEND_DIGEST'). Refusing to deploy."
            exit 1
          fi
          if [ -z "$FRONTEND_REPOSITORY" ] || [ "$FRONTEND_REPOSITORY" = "null" ] || ! [[ "$FRONTEND_DIGEST" =~ $DIGEST_RE ]]; then
            echo "::error::release-manifest.json's frontend digest is missing or malformed ('$FRONTEND_DIGEST'). Refusing to deploy."
            exit 1
          fi

          echo "==> Promoting release $RELEASE_TAG (commit $GIT_SHA) to ${{ inputs.environment }}"
          echo "    backend:  $BACKEND_REPOSITORY@$BACKEND_DIGEST (built from $BACKEND_TAG)"
          echo "    frontend: $FRONTEND_REPOSITORY@$FRONTEND_DIGEST (built from $FRONTEND_TAG)"

          {
            echo "backend_image=${BACKEND_REPOSITORY}@${BACKEND_DIGEST}"
            echo "frontend_image=${FRONTEND_REPOSITORY}@${FRONTEND_DIGEST}"
            echo "git_sha=${GIT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC — no client secret stored anywhere)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "rg-schoolflow-${{ inputs.environment }}" \
            --location francecentral

      - name: Validate Bicep template (what-if — no changes applied)
        env:
          POSTGRES_ADMIN_PASSWORD_DEV: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD_REC: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD_PROD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          # Read by the .bicepparam file itself (readEnvironmentVariable) —
          # not passed as a separate --parameters override. A .bicepparam
          # file's own completeness is validated independently of any
          # same-command-line --parameters key=value, so a required
          # (no-default) parameter like this one must be satisfied inside
          # the file, exactly like postgresAdminPassword already is.
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.manifest.outputs.frontend_image }}
          RELEASE_SHA: ${{ steps.manifest.outputs.git_sha }}
        run: |
          az deployment group what-if \
            --resource-group "rg-schoolflow-${{ inputs.environment }}" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/${{ inputs.environment }}.bicepparam

      # The `environment:` protection rule above already required a human
      # reviewer to approve this run before reaching this step — that
      # approval IS the deploy confirmation, no further prompt here.
      #
      # ONE-SHOT MIGRATIONS (P0 — docs/AZURE_ONE_SHOT_MIGRATIONS.md): this
      # used to be a single `az deployment group create` that rolled out
      # infra AND api/worker/frontend together, with Alembic running inside
      # the api container at startup. schoolflow_app (the role api/worker
      # connect as) now has no DDL privileges at all, so migrations must
      # complete, successfully, BEFORE api/worker/frontend are touched.
      # Step 1 below deploys with deployApps=false — infra/container-apps.
      # bicep's `if (deployApps)` condition skips api/worker/frontend
      # entirely on this pass, so only containerAppsEnv and the new
      # migrationJob resource are created/updated (both unconditional).
      - name: Deploy infrastructure + migration job (deployApps=false)
        env:
          POSTGRES_ADMIN_PASSWORD_DEV: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD_REC: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD_PROD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.manifest.outputs.frontend_image }}
          RELEASE_SHA: ${{ steps.manifest.outputs.git_sha }}
        run: |
          az deployment group create \
            --resource-group "rg-schoolflow-${{ inputs.environment }}" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/${{ inputs.environment }}.bicepparam \
            --parameters deployApps=false \
            --query "properties.outputs"

      # Runs `alembic upgrade head` as schoolflow_migrator (DATABASE_URL_
      # MIGRATIONS) — see infra/azure/modules/container-apps.bicep's
      # migrationJob resource. `az containerapp job start` only enqueues
      # the execution; it does not block on the container's exit code, so
      # this step polls the execution's own status instead of trusting the
      # CLI call's own (always-success) exit code.
      - name: Run database migration job
        id: migrate
        run: |
          set -euo pipefail
          JOB_NAME="caj-schoolflow-migrate-${{ inputs.environment }}"
          RG="rg-schoolflow-${{ inputs.environment }}"

          echo "==> Starting $JOB_NAME"
          EXECUTION_NAME=$(az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "$RG" \
            --query "name" -o tsv)
          echo "Execution: $EXECUTION_NAME"

          echo "==> Waiting for migration job to finish (timeout 600s)"
          STATUS="Running"
          ELAPSED=0
          while [ "$STATUS" = "Running" ] && [ "$ELAPSED" -lt 600 ]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            STATUS=$(az containerapp job execution show \
              --name "$JOB_NAME" \
              --resource-group "$RG" \
              --job-execution-name "$EXECUTION_NAME" \
              --query "properties.status" -o tsv)
            echo "   -> status=$STATUS (${ELAPSED}s elapsed)"
          done

          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Migration job did not succeed (status=$STATUS)."
            echo "         Inspect its logs before retrying:"
            echo "         az containerapp job logs show --name $JOB_NAME --resource-group $RG"
            echo "         See docs/AZURE_ONE_SHOT_MIGRATIONS.md#troubleshooting."
            exit 1
          fi
          echo "==> Migration job succeeded"

      # This step — and therefore api/worker/frontend rollout — is only
      # reached when the previous step exited 0. A failed "Run database
      # migration job" step stops the workflow here: GitHub Actions does
      # not run subsequent steps in the same job after one fails (no
      # `continue-on-error` is set anywhere above), so a broken migration
      # can never reach a running application deployment.
      - name: Deploy application (api/worker/frontend, deployApps=true)
        env:
          POSTGRES_ADMIN_PASSWORD_DEV: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD_REC: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD_PROD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.manifest.outputs.frontend_image }}
          RELEASE_SHA: ${{ steps.manifest.outputs.git_sha }}
        run: |
          az deployment group create \
            --resource-group "rg-schoolflow-${{ inputs.environment }}" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/${{ inputs.environment }}.bicepparam \
            --parameters deployApps=true \
            --query "properties.outputs"
